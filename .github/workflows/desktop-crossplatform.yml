name: Piano Booster - Windows and macOS builds
on:
  workflow_dispatch:
  push:
    branches:
      - pianobooster-desktop-build

jobs:
  windows-x64:
    name: Windows x64 (Qt6 / MIDI / FluidSynth)
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git zip unzip patch pkgconf
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-fluidsynth
      - name: Compile Windows desktop app and deploy Qt
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          cat PianoBooster-source.zip.part-* > PianoBooster-source.zip
          unzip -q PianoBooster-source.zip
          cd PianoBooster
          patch -p1 < ../crossplatform-build-fixes.patch
          patch -p1 < ../crossplatform-draw-fixes.patch
          patch -p1 < ../crossplatform-language-fixes.patch
          patch -p1 < ../crossplatform-startup-init.patch
          patch -p1 < ../crossplatform-macos-menu-crash-guard.patch
          grep -q 'window.init();' src/QtMain.cpp
          cmake -S . -B out/win -G Ninja -DQT_PACKAGE_NAME=Qt6 -DUSE_FTGL=OFF -DUSE_BUNDLED_RTMIDI=ON -DWITH_INTERNAL_FLUIDSYNTH=ON -DNO_DOCS=ON -DUSE_SYSTEM_FONT=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build out/win --parallel 4
          mkdir -p dist/PianoBooster-Windows-x64/music dist/PianoBooster-Windows-x64/tools
          cp out/win/build/pianobooster.exe dist/PianoBooster-Windows-x64/PianoBooster.exe
          cp music/BoosterMusicBooks.zip dist/PianoBooster-Windows-x64/music/
          cp packaging/WINDOWS-MACOS-README.txt dist/PianoBooster-Windows-x64/LEEME.txt
          cp NOTICE-MODIFICACIONES-Y-AUTORES.md dist/PianoBooster-Windows-x64/
          cp license.txt gplv3.txt dist/PianoBooster-Windows-x64/
          /ucrt64/bin/windeployqt6.exe --release dist/PianoBooster-Windows-x64/PianoBooster.exe
          python packaging/collect_msys_dlls.py dist/PianoBooster-Windows-x64 /ucrt64/bin
          # The app reads its language choices from translations/langs.json and
          # actual Qt .qm catalogs next to the program. Ship all 18 languages.
          mkdir -p dist/PianoBooster-Windows-x64/translations
          cp translations/langs.json out/win/build/translations/pianobooster_*.qm dist/PianoBooster-Windows-x64/translations/
          for locale in es de fr it; do
            test -s "dist/PianoBooster-Windows-x64/translations/pianobooster_${locale}.qm"
          done
          test "$(find dist/PianoBooster-Windows-x64/translations -name 'pianobooster_*.qm' | wc -l)" -ge 18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package advanced score engine for Windows
        shell: pwsh
        run: |
          Set-Location PianoBooster
          python -m pip install --upgrade pip
          python -m pip install pyinstaller mido pillow numpy pypdfium2
          python -m PyInstaller --clean --noconfirm --onefile --name score-engine --paths tools tools/advanced_score.py
          New-Item -ItemType Directory -Force dist/PianoBooster-Windows-x64/score-engine
          Copy-Item dist/score-engine.exe dist/PianoBooster-Windows-x64/score-engine/score-engine.exe
          Compress-Archive -Path dist/PianoBooster-Windows-x64 -DestinationPath ../PianoBooster-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PianoBooster-Windows-x64
          path: PianoBooster-Windows-x64.zip

  macos:
    name: macOS (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Intel-x64
            runner: macos-15-intel
          - label: AppleSilicon-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and native audio dependencies
        run: |
          cat PianoBooster-source.zip.part-* > PianoBooster-source.zip
          unzip -q PianoBooster-source.zip
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install cmake ninja pkg-config qt fluidsynth dylibbundler
      - name: Build macOS .app
        shell: bash
        run: |
          set -euxo pipefail
          cd PianoBooster
          patch -p1 < ../crossplatform-build-fixes.patch
          patch -p1 < ../crossplatform-draw-fixes.patch
          patch -p1 < ../crossplatform-language-fixes.patch
          # macOS-only: native Apple DLS/CoreAudio output (not FluidSynth).
          patch -p1 < ../crossplatform-native-coreaudio.patch
          # First run macOS: continuous listening mode, correctly selected
          # Spanish UI, with educational Follow-You still user-selectable.
          patch -p1 < ../crossplatform-macos-playback-language.patch
          patch -p1 < ../crossplatform-startup-init.patch
          patch -p1 < ../crossplatform-macos-menu-crash-guard.patch
          # Mac-specific audio channel isolation, genuine CoreAudio PCM meters
          # and expert engraver diagnosis, leaving Debian unchanged.
          patch -p1 < ../crossplatform-macos-pcm-accomp-expert.patch
          grep -q 'kAudioUnitSubType_MultiChannelMixer' src/MidiDeviceCoreAudio.cpp
          grep -q 'autoAccompanimentMigration' src/GuiSidePanel.cpp
          grep -q 'MuseScore Studio.app' tools/advanced_score.py
          # Full app startup must execute before we can claim the menu/locale
          # and CoreAudio fixes work. Prior builds called show() without init().
          grep -q 'window.init();' src/QtMain.cpp
          grep -q 'setNativeMenuBar(false)' src/QtWindow.cpp
          grep -q 'QMenu::title()' src/QtWindow.cpp
          grep -q 'ListenModeMigration20261021' src/GuiSidePanel.cpp
          grep -q 'SpanishDefaultMigration20261021' src/Settings.cpp
          grep -q 'MidiDeviceCoreAudio.cpp' src/CMakeLists.txt
          grep -q 'CoreAudio (Mac)' src/MidiDeviceCoreAudio.h
          export PATH="$(brew --prefix qt)/bin:$PATH"
          cmake -S . -B out/mac -G Ninja -DQT_PACKAGE_NAME=Qt6 -DUSE_FTGL=OFF -DUSE_BUNDLED_RTMIDI=ON -DWITH_INTERNAL_FLUIDSYNTH=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DUSE_SYSTEM_FONT=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build out/mac --parallel 3
          # CoreAudio DLS must be linked in the built native executable.
          otool -L out/mac/build/pianobooster.app/Contents/MacOS/pianobooster | grep -q AudioToolbox
          # Attempt a real CoreAudio DLS note and PCM-meter probe on the
          # GitHub macOS runner. Lack of a connected audio device is reported
          # but does not invalidate a correctly compiled package.
          if out/mac/build/pianobooster.app/Contents/MacOS/pianobooster --probe-coreaudio; then
            echo "CoreAudio native PCM render probe PASSED"
          else
            echo "::warning::CoreAudio PCM hardware probe failed on hosted runner; verify on physical Mac"
          fi
          APP=out/mac/build/pianobooster.app
          test -f "$APP/Contents/MacOS/pianobooster"
          mkdir -p "$APP/Contents/Resources/score-engine"
          mkdir -p "$APP/Contents/Resources/tools"
          cp packaging/WINDOWS-MACOS-README.txt "$APP/Contents/Resources/LEEME.txt"
          cp NOTICE-MODIFICACIONES-Y-AUTORES.md license.txt gplv3.txt "$APP/Contents/Resources/"
          # macdeployqt bundles Qt and compatible Homebrew dylibs. A later
          # dylibbundler -od invocation used to DELETE the entire Frameworks
          # directory (including QtXml, QtCore and QtGui) from the final DMG.
          # Never run dylibbundler -od after macdeployqt.
          "$(brew --prefix qt)/bin/macdeployqt" "$APP" -verbose=1
          # CMake builds *.qm but the .app currently only includes langs.json.
          # Without those files the Preferences menu offers only English.
          mkdir -p "$APP/Contents/Resources/translations"
          cp translations/langs.json out/mac/build/translations/pianobooster_*.qm "$APP/Contents/Resources/translations/"
          for locale in es de fr it; do
            test -s "$APP/Contents/Resources/translations/pianobooster_${locale}.qm"
          done
          test "$(find "$APP/Contents/Resources/translations" -name 'pianobooster_*.qm' | wc -l)" -ge 18
          for module in QtCore QtGui QtWidgets QtXml QtOpenGL QtOpenGLWidgets QtCore5Compat; do
            FRAMEWORK="$APP/Contents/Frameworks/${module}.framework/Versions/A/${module}"
            test -f "$FRAMEWORK" || { echo "::error::Missing bundled Qt framework: $FRAMEWORK"; exit 1; }
          done
          test -n "$(find "$APP/Contents/Frameworks" -type f -print -quit)" || { echo "::error::No dynamic frameworks packaged"; exit 1; }
          # Validate the executable with the packaged libraries, not Homebrew.
          # Runtime linking errors (DYLD) must fail the workflow, not reach users.
          "$APP/Contents/MacOS/pianobooster" --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bundle the advanced score Python engine
        shell: bash
        run: |
          set -euxo pipefail
          cd PianoBooster
          python -m pip install pyinstaller mido numpy pillow pypdfium2
          python -m PyInstaller --clean --noconfirm --onefile --name score-engine --paths tools tools/advanced_score.py
          APP=out/mac/build/pianobooster.app
          cp dist/score-engine "$APP/Contents/Resources/score-engine/score-engine"
          chmod +x "$APP/Contents/Resources/score-engine/score-engine"
          "$APP/Contents/Resources/score-engine/score-engine" --help >/dev/null
          # Re-sign the complete final bundle after adding the score engine.
          # Development-only ad-hoc signature, not Apple notarization.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          "$APP/Contents/MacOS/pianobooster" --version
          mkdir -p staging
          cp -R "$APP" "staging/PianoBooster.app"
          # Verify that the .app actually being put in the DMG contains QtXml.
          test -f "staging/PianoBooster.app/Contents/Frameworks/QtXml.framework/Versions/A/QtXml"
          test -s "staging/PianoBooster.app/Contents/Resources/translations/pianobooster_es.qm"
          test -s "staging/PianoBooster.app/Contents/Resources/translations/langs.json"
          "staging/PianoBooster.app/Contents/MacOS/pianobooster" --version
          hdiutil create -volname 'PianoBooster' -srcfolder staging -ov -format UDZO "../PianoBooster-macOS-${{ matrix.label }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: PianoBooster-macOS-${{ matrix.label }}
          path: PianoBooster-macOS-${{ matrix.label }}.dmg
